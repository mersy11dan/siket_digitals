<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Siket Digitals builds modern, responsive websites for businesses and organizations."
    />
    <meta name="theme-color" content="#e6e0d1" />
    <title>Siket Digitals</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      (function () {
        try {
          var query = new URLSearchParams(location.search).get("theme");
          var saved = localStorage.getItem("siket-theme");
          var theme =
            query === "light" || query === "dark"
              ? query
              : saved === "light" || saved === "dark"
                ? saved
                : window.matchMedia("(prefers-color-scheme: dark)").matches
                  ? "dark"
                  : "light";
          document.documentElement.dataset.theme = theme;
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", theme === "dark" ? "#131311" : "#e6e0d1");
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
